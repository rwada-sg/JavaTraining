<!DOCTYPE html>
<html th:replace="~{layout/app :: layout('料金名検索結果', ~{::content}, 'charge')}" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="content">
  <!--/*
        料金名情報検索結果表示画面
    */-->
  <a role="button" th:href="@{/charge/search}" class="secondary">戻る</a>

  <table>
    <thead>
      <tr>
        <th>料金番号</th>
        <th>料金名</th>
        <th>月額料金</th>
        <th>適用開始日</th>
        <th>適用終了日</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${!#lists.isEmpty(result)}" th:each="row : ${result}">
        <td>
          <a th:href="@{/charge/edit/{id}(id=${row.id})}" th:text="${row.id}"></a>
        </td>
        <td th:text="${row.chargeName}"></td>
        <td th:text="${row.monthlyCharge}"></td>
        <td th:text="${#temporals.format(row.startDate, 'yyyy/MM/dd')}"></td>
        <td th:text="${#temporals.format(row.endDate, 'yyyy/MM/dd')}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(result)}">
        <td colspan="7" class="no-result">該当する情報が見つかりませんでした。</td>
      </tr>
    </tbody>
  </table>
</div>

</html>
